<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUMAN Agent Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Barlow:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark presentation stage. Narration left, the person's agent app (phone) center, the merchant's agent browser right with the HUMAN Sightline console docked on it. Chapter pills on top, transport controls bottom. */
:root{
  color-scheme:dark;
  --stage:#0E0C18; --stage-2:#15122A; --raise:#1C1833; --line:#2B2648; --line-2:#3A3360;
  --ink:#F4F2FF; --muted:#A49EC6; --faint:#6E6893;
  --purple:#6C47FF; --purple-deep:#5728DE; --lav:#EAE4FB; --lav-2:#F6F4FF;
  --ok:#22C55E; --warn:#F59E0B; --bad:#F04848;
  --paper:#FFFFFF; --paper-ink:#1A1A1A; --paper-muted:#6B7280; --paper-line:#E0E1EE; --paper-soft:#F8F8FC;
  --f-display:"Bricolage Grotesque","Barlow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;
  background-image:radial-gradient(900px 520px at 72% 42%,rgba(108,71,255,.16),transparent 65%),radial-gradient(700px 400px at 8% 90%,rgba(87,40,222,.10),transparent 70%);background-attachment:fixed;}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

.app{min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 14px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:4px;background:var(--stage-2);border:1px solid var(--line);border-radius:999px;padding:5px;flex-wrap:wrap;max-width:100%}
.brand{display:flex;align-items:center;gap:8px;padding:0 12px 0 6px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.02em;white-space:nowrap;padding-left:10px;gap:10px}
.brand .hlogo{height:20px;width:auto;aspect-ratio:480/111;color:#fff}
.brand .div{width:1px;height:18px;background:var(--line-2)}
.brand small{font-weight:600;color:var(--muted);font-size:14px;letter-spacing:0}
.pill{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
.pill b{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--faint)}
.pill:hover{color:var(--ink)}
.pill[aria-current="true"]{background:var(--ink);color:var(--stage)}
.pill[aria-current="true"] b{color:var(--purple-deep)}

/* ---------- stage ---------- */
.stage{flex:1;display:grid;grid-template-columns:minmax(250px,330px) 300px minmax(0,1fr);gap:28px;align-items:center;max-width:1480px;width:100%;margin:0 auto}
.stage.wide{grid-template-columns:minmax(250px,330px) minmax(0,1fr)}
.stage.wide .phone-col{display:none}

.narr{min-width:0;align-self:center}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:14px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--purple)}
.narr h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.1vw,42px);line-height:1.06;letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
.narr p{color:var(--muted);font-size:16px;line-height:1.55;margin:0;max-width:34ch}
.narr .count{margin-top:22px;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);letter-spacing:.06em}
.narr .anim{animation:rise .45s ease both}

.phone-col,.browser-col{transition:opacity .35s ease,filter .35s ease,transform .35s ease;min-width:0}
.stage[data-focus="phone"] .browser-col,.stage[data-focus="browser"] .phone-col{opacity:.32;filter:saturate(.4);transform:scale(.985)}

/* ---------- phone ---------- */
.phone{width:300px;height:620px;border-radius:44px;background:#F6F6F7;color:#141414;border:9px solid #1E1B29;box-shadow:0 0 0 1px #3A3654,0 30px 80px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;flex-direction:column;margin:0 auto;font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif}
.p-status{display:flex;justify-content:space-between;align-items:center;padding:11px 22px 2px;font-size:13px;font-weight:600;color:#000}
.p-status .ic{display:flex;gap:4px;align-items:center}
.p-head{position:relative;height:74px;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 12px 0;flex:none}
.p-round{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);display:grid;place-items:center}
.p-invite{background:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.p-ava{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.p-ava .muse{width:52px;height:52px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.12))}
.p-ava .nm{margin-top:-9px;background:#fff;border-radius:999px;padding:3px 11px;font-weight:600;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.p-msgs{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 34px);mask-image:linear-gradient(transparent 0,#000 34px);padding-top:30px!important;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;padding:8px 12px 10px}
.m{font-size:13.5px;line-height:1.38;padding:10px 13px;border-radius:18px}
.m.me{align-self:flex-end;max-width:82%;background:#141414;color:#fff}
.m.muse{align-self:stretch;background:#EBEBEE;color:#141414}
.m.time,.m.sys{align-self:center;background:none;padding:2px 0;color:#8A8A90;font-size:11px;border-radius:0;display:flex;gap:6px;align-items:center}
.m.sys .dot{width:6px;height:6px;border-radius:50%;background:#A6A6AE;flex:none}
.m.sys.ok .dot{background:var(--ok)}
.m.card{align-self:stretch;background:#EBEBEE;color:#141414;font-size:12.5px}
.m.card .row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.m.card .row span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.m .opt{display:block;border:1px dashed #B5B5BC;border-radius:10px;padding:8px 10px;margin-top:7px;font-size:12.5px}
.m.enter{animation:rise .4s ease both}
.p-input{margin:0 10px 8px;background:#fff;border-radius:22px;min-height:44px;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 12px;font-size:13.5px;color:#141414;box-shadow:0 2px 12px rgba(0,0,0,.06);flex:none}
.p-input .txt{flex:1;min-width:0;line-height:1.35}
.p-input .txt.ph{color:#9A9AA2}
.p-input svg{flex:none;color:#141414}
.caret{display:inline-block;width:1.5px;height:15px;background:#4C7BF4;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.p-tabs{margin:0 10px 12px;background:#fff;border-radius:26px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(5,1fr);padding:5px;flex:none}
.p-tabs span{height:36px;display:grid;place-items:center;border-radius:20px;color:#141414}
.p-tabs span.on{background:#EDEDF0}
.p-tabs svg{width:18px;height:18px}

/* consent sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);color:var(--paper-ink);border-radius:26px 26px 0 0;padding:16px 16px 18px;box-shadow:0 -20px 50px rgba(0,0,0,.5);animation:sheetUp .45s cubic-bezier(.2,.8,.2,1) both}
.sheet .lead{font-size:12.5px;color:var(--paper-muted);margin:0 0 10px;line-height:1.4}
.sheet .hd{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--purple-deep)}
.sheet .hd .hlogo{height:15px;width:auto;aspect-ratio:480/111}
.sheet .hd .ad{font-family:var(--f-body);font-weight:600;font-size:13px;color:var(--paper-ink)}
.sheet .hd .vc{margin-left:auto;font-family:var(--f-body);font-weight:600;font-size:10.5px;color:var(--paper-muted);background:var(--lav-2);border:1px solid var(--paper-line);border-radius:999px;padding:3px 8px}
.sheet h3{font-family:var(--f-display);font-size:19px;margin:10px 0 10px;letter-spacing:-.01em}
.kv{border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;background:var(--paper-soft)}
.kv div{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 10px;font-size:12.5px;border-top:1px solid var(--paper-line)}
.kv div:first-child{border-top:0}
.kv dt{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--paper-muted);padding-top:2px;margin:0}
.kv dd{margin:0;color:var(--paper-ink);font-weight:500}
.sheet .btns{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:12px}
.sheet .btns span{display:flex;justify-content:center;align-items:center;gap:6px;border-radius:12px;padding:11px 8px;font-weight:600;font-size:13px;background:var(--paper-soft);border:1px solid var(--paper-line)}
.sheet .btns span.go{background:var(--purple-deep);color:#fff;border-color:var(--purple-deep)}
.checks{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.chk{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--paper-soft);font-size:13px;animation:rise .35s ease both}
.chk i{color:#fff;width:18px;height:18px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.chk i svg{width:11px;height:11px}
.sheet .foot{font-size:11px;color:var(--paper-muted);text-align:center;margin-top:10px;line-height:1.4}
.faceid{display:grid;place-items:center;margin:4px 0 8px}
.faceid svg{width:54px;height:54px;color:var(--purple-deep)}

/* ---------- browser ---------- */
.browser-col{position:relative}
.browser{background:var(--paper);color:var(--paper-ink);border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line-2),0 30px 80px rgba(0,0,0,.5);height:600px;display:flex;flex-direction:column}
.b-chrome{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#1B1828;color:var(--muted);font-size:12px}
.b-dots{display:flex;gap:6px}.b-dots i{width:10px;height:10px;border-radius:50%;background:#3A3654}
.b-tag{display:flex;align-items:center;gap:6px;background:#26223A;border-radius:6px;padding:3px 8px;white-space:nowrap}
.b-tag .muse{width:12px;height:12px}
.b-url{flex:1;min-width:0;background:#110F1C;border-radius:6px;padding:4px 10px;font-family:var(--f-mono);font-size:11.5px;color:#C9C4E4;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-live{display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;color:var(--muted)}
.b-live .hmark{width:13px;height:13px;color:#fff}
.b-page{flex:1;position:relative;overflow:hidden;min-height:0}
.b-page > .pg{position:absolute;inset:0;overflow:hidden;animation:fade .35s ease both}

/* merchant header (generic mock styling, not merchant trade dress) */
.mh{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--paper-line);font-size:12.5px;color:var(--paper-muted)}
.mh .wm{font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--paper-ink);letter-spacing:-.01em}
.mh .sp{flex:1}
.mh .mk{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px dashed #C9CBDB;border-radius:4px;padding:2px 6px}
.vbar{display:flex;align-items:center;gap:8px;background:var(--lav);color:var(--purple-deep);font-size:12px;padding:7px 20px;font-weight:500;animation:fade .4s ease both}
.vbar .hmark{width:15px;height:15px}
.vbar .sp{flex:1}
.vbar b{font-weight:700}
.pbody{padding:18px 20px}
.pbody h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.pbody .sub{color:var(--paper-muted);font-size:13px;margin-bottom:14px}
.items{border:1px solid var(--paper-line);border-radius:10px;overflow:hidden}
.it{display:grid;grid-template-columns:34px 1fr auto auto;gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--paper-line);font-size:13.5px}
.it:first-child{border-top:0}
.it .th{width:34px;height:34px;border-radius:8px;background:var(--paper-soft);display:grid;place-items:center;font-size:10px;color:var(--paper-muted);font-weight:600}
.it .q{color:var(--paper-muted);font-size:12.5px}
.it .pr{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}
.it.more{grid-template-columns:1fr auto;color:var(--paper-muted);font-size:12.5px;background:var(--paper-soft)}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px;flex-wrap:wrap}
.tot .n{font-variant-numeric:tabular-nums;font-size:13px;color:var(--paper-muted)}
.tot .n b{color:var(--paper-ink);font-size:18px;font-family:var(--f-display)}
.cta{background:var(--paper-ink);color:#fff;border-radius:999px;padding:10px 22px;font-weight:600;font-size:13px;white-space:nowrap}
.cta.dim{opacity:.35}

.prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding:22px 20px}
.art{border-radius:14px;background:var(--paper-soft);aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;border:1px solid var(--paper-line)}
.art canvas{width:72%;height:72%}
.prod .badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9A3412;background:#FFEDD5;border-radius:4px;padding:3px 7px;margin-bottom:10px}
.prod h2{font-family:var(--f-display);font-size:24px;line-height:1.1;margin:0 0 6px}
.prod .price{font-family:var(--f-display);font-size:26px;font-weight:700;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.prod ul{margin:12px 0 18px;padding-left:18px;color:var(--paper-muted);font-size:13px;line-height:1.6}
.stock{font-size:12.5px;color:var(--paper-muted);margin-top:10px;font-variant-numeric:tabular-nums}

.listing{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;padding:20px}
.house{border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:linear-gradient(180deg,#CFE3F5 0%,#E9F1F8 62%,#C9D9B8 62%,#B6CBA2 100%);position:relative}
.house svg{position:absolute;left:10%;bottom:12%;width:80%}
.listing .price{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.listing .facts{display:flex;gap:14px;font-size:13px;margin:4px 0;color:var(--paper-ink);flex-wrap:wrap}
.listing .addr{color:var(--paper-muted);font-size:13px;margin-bottom:14px}
.tour{border:1px solid var(--paper-line);border-radius:12px;padding:12px}
.tour h4{margin:0 0 8px;font-size:13px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.slot{border:1px solid var(--paper-line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11.5px;line-height:1.3}
.slot b{display:block;font-size:12.5px}
.slot.sel{border-color:var(--purple-deep);background:var(--lav-2);color:var(--purple-deep)}

.confirm{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;padding:24px 24px 250px;gap:8px}
.confirm .ok{width:52px;height:52px;border-radius:50%;background:#DCFCE7;display:grid;place-items:center;margin-bottom:6px}
.confirm .ok svg{width:24px;height:24px;color:#15803D}
.confirm h2{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em}
.confirm p{margin:0;color:var(--paper-muted);font-size:14px;max-width:44ch;line-height:1.5}
.confirm .ref{font-family:var(--f-mono);font-size:11.5px;color:var(--paper-muted);margin-top:6px}

/* the door overlay on a merchant page */
.door{position:absolute;inset:0;background:rgba(246,244,255,.82);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px 20px 150px;animation:fade .35s ease both}
.door-card{width:min(360px,100%);background:#fff;border:1px solid var(--paper-line);border-radius:16px;padding:22px 20px 16px;text-align:center;box-shadow:0 20px 50px rgba(87,40,222,.14)}
.door-card .hmark{width:36px;height:36px;margin:0 auto 10px;display:block}
.door-card h3{font-family:var(--f-display);font-size:19px;margin:0 0 6px;color:var(--paper-ink);letter-spacing:-.01em}
.door-card p{font-size:13px;color:var(--paper-muted);margin:0 0 14px;line-height:1.45}
.door-st{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--purple-deep);background:var(--lav-2);border-radius:999px;padding:7px 12px}
.door-st .spin{width:12px;height:12px;border:2px solid var(--lav);border-top-color:var(--purple-deep);border-radius:50%;animation:spin 1s linear infinite}
.door-st.ok{color:#15803D;background:#DCFCE7}
.door-st.bad{color:#B91C1C;background:#FEE2E2}
.door-card .by{font-size:10.5px;color:var(--paper-muted);margin-top:10px;font-family:var(--f-mono)}

/* swarm */
.swarm{padding:18px 20px}
.swarm h2{font-family:var(--f-display);font-size:20px;margin:0 0 4px}
.swarm .sub{color:var(--paper-muted);font-size:13px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px}
.tiles i{aspect-ratio:1;border-radius:3px;background:var(--lav);animation:pop .3s ease both}
.tiles.blocked i{background:#FCA5A5}
.tiles i.mine{background:var(--ok)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--paper-muted);margin-top:12px;flex-wrap:wrap}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* console page (chapter 4) */
.console{background:#F8F7FD;height:100%;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);gap:0;align-items:center}
.vcard{background:#fff;border:1px solid var(--paper-line);border-radius:14px;padding:16px;box-shadow:0 14px 34px rgba(87,40,222,.08)}
.vcard .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.vcard .t span{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--paper-muted);text-transform:uppercase}
.verdict{font-family:var(--f-display);font-weight:700;font-size:13px;color:#15803D;background:#DCFCE7;border-radius:999px;padding:4px 10px}
.vcard dl{margin:0;display:grid;grid-template-columns:78px 1fr;row-gap:7px;column-gap:10px;font-size:12.5px}
.vcard dt{color:var(--paper-muted);font-size:11px;font-weight:600;letter-spacing:.04em;padding-top:1px}
.vcard dd{margin:0;font-weight:500}
.wires{height:100%;width:52px}
.outs{display:flex;flex-direction:column;gap:8px}
.out{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:10px 12px;font-size:13px;animation:slideIn .4s ease both}
.out .ic{width:26px;height:26px;border-radius:7px;background:var(--lav-2);color:var(--purple-deep);display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:500;flex:none}
.out small{display:block;color:var(--paper-muted);font-size:11.5px}
.out.ghost{opacity:.3;animation:none}
.ev{font-family:var(--f-mono);font-size:11.5px;line-height:1.6;background:#14111F;color:#D6D1F0;border-radius:12px;padding:14px 16px;white-space:pre;overflow:auto;animation:fade .4s ease both}
.ev .k{color:#A792FF}.ev .s{color:#7EE7C2}.ev .c{color:#6E6893}
.sticks{display:flex;flex-direction:column;gap:8px}
.stick{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;animation:slideIn .4s ease both}
.stick i{width:20px;height:20px;border-radius:50%;background:var(--purple-deep);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;flex:none;margin-top:1px}

/* ---------- Sightline console panel ---------- */
.panel{position:absolute;right:-18px;bottom:-22px;width:318px;background:var(--raise);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;animation:panelIn .45s cubic-bezier(.2,.8,.2,1) both;z-index:3}
.panel-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.panel-h .hmark{width:16px;height:16px;color:#fff}
.panel-h .lv{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--faint);font-weight:400}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:10px 12px 4px}
.pipe span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:center;padding-top:7px;border-top:3px solid var(--line);font-weight:600}
.pipe span.done{color:var(--muted);border-color:var(--purple-deep)}
.pipe span.now{color:var(--ink);border-color:var(--purple)}
.pipe span.fail{color:#FCA5A5;border-color:var(--bad)}
.panel-b{padding:8px 12px 12px;font-size:12px}
.prow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow span:first-child{color:var(--faint)}
.prow span:last-child{text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--ink)}
.prow .g{color:#7EE7A6}.prow .r{color:#FCA5A5}.prow .y{color:#FCD34D}
.code{font-family:var(--f-mono);font-size:10.8px;line-height:1.6;background:#110F1C;border-radius:8px;padding:9px 10px;color:#CFC9EC;white-space:pre;overflow:hidden}
.code .k{color:#A792FF}.code .s{color:#7EE7C2}
.sd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sd > div{background:#110F1C;border-radius:8px;padding:8px 9px}
.sd h5{margin:0 0 6px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sd p{margin:0 0 4px;font-size:11.5px;line-height:1.35;display:flex;gap:6px}
.sd p i{font-style:normal;flex:none;width:12px}
.vpill{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding:8px 10px;border-radius:8px;font-weight:700;font-family:var(--f-display);font-size:13px}
.vpill.allow{background:rgba(34,197,94,.14);color:#86EFAC}
.vpill.block{background:rgba(240,72,72,.16);color:#FCA5A5}
.vpill small{font-family:var(--f-mono);font-weight:400;font-size:10px;opacity:.8}

/* ---------- controls ---------- */
.ctrl{display:flex;flex-direction:column;align-items:center;gap:10px}
.prog{display:flex;gap:5px}
.prog button{width:16px;height:16px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.prog button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.prog button.past::after{background:var(--faint)}
.prog button.cur::after{background:var(--purple);box-shadow:0 0 0 3px rgba(108,71,255,.3)}
.trans{display:flex;align-items:center;gap:6px;background:var(--stage-2);border:1px solid var(--line);border-radius:999px;padding:5px}
.trans button{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.trans button:hover{color:var(--ink);background:var(--raise)}
.trans button.next{background:var(--ink);color:var(--stage)}
.trans button:disabled{opacity:.3;cursor:default}
.trans .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.trans svg{width:17px;height:17px}
.keys{font-size:12px;color:var(--faint);text-align:center}
.disc{font-size:11px;color:var(--faint);text-align:center}

.hmark,.muse,.hlogo{display:inline-block;flex:none}
.hmark{color:var(--purple-deep)}
.hlogo{color:var(--purple-deep)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .stage{grid-template-columns:300px minmax(0,1fr);gap:22px 26px}
  .stage.wide{grid-template-columns:minmax(0,1fr)}
  .narr{grid-column:1/-1}
  .narr p{max-width:60ch}
  .panel{right:10px;bottom:10px}
}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .stage[data-focus="phone"] .browser-col,.stage[data-focus="browser"] .phone-col{display:none}
  .phone{transform:none}
  .browser{height:auto;min-height:520px}
  .b-page{min-height:470px}
  .panel{position:relative;right:auto;bottom:auto;width:100%;margin-top:12px}
  .prod,.listing{grid-template-columns:1fr}
  .console{grid-template-columns:1fr;gap:12px;height:auto}
  .wires{display:none}
  .b-page > .pg{position:relative}
  .b-page > .pg.con{min-height:470px}
  .door{padding-bottom:20px}
  .confirm{padding-bottom:40px}
  .brand small,.keys{display:none}
  .b-tag{display:none}
}

/* ---------------- Sightline panel ---------------- */
const STAGES=['Detect','Ask','Consent','Verify','Judge'];
function panelHTML(p){
  const pipe = STAGES.map((s,i)=>{let c=''; if(p.fail===i) c='fail'; else if(i<p.stage) c='done'; else if(i===p.stage) c='now'; return `<span class="${c}">${s}</span>`}).join('');
  let body='';
  const rows = r => r.map(x=>`<div class="prow"><span>${x[0]}</span><span class="${x[2]||''}">${x[1]}</span></div>`).join('');
  switch(p.kind){
    case 'detect': body = rows(p.rows); break;
    case 'intent': body = `<div class="code">${p.code}</div>`; break;
    case 'verify': body = rows(p.rows); break;
    case 'judge': body = `<div class="sd"><div><h5>Says</h5>${p.says.map(x=>`<p><i>·</i>${x}</p>`).join('')}</div><div><h5>Does</h5>${p.does.map(x=>`<p><i class="${x[1]?'g':'r'}" style="color:${x[1]?'#7EE7A6':'#FCA5A5'}">${x[1]?'✓':'✕'}</i>${x[0]}</p>`).join('')}</div></div>
      <div class="vpill ${p.verdict}"><span>${p.verdict==='allow'?'Allow':'Block'} · ${p.vnote}</span><small>${p.ms} ms</small></div>`; break;
    case 'policy': body = rows(p.rows); break;
  }
  return `<div class="panel" role="status"><div class="panel-h">${H}HUMAN Sightline · ${p.title||'Agent Door'}<span class="lv">${p.sess||'sess_4c1e·a09'}</span></div><div class="pipe">${pipe}</div><div class="panel-b">${body}</div></div>`;
}

  });

/* ---------------- render ---------------- */
const $=id=>document.getElementById(id);
let ci=0, si=0, prevKey='', typer=null;

function renderPills(){
  $('pills').innerHTML = CH.map((c,i)=>`<button class="pill" data-c="${i}" aria-current="${i===ci}"><b>${i+1}</b>${c.label}</button>`).join('');
  $('pills').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.c,0));
}
function render(){
  const ch=CH[ci], s=ch.steps[si];
  const key=ci+':'+si;
  const prev = prevKey.startsWith(ci+':') ? ch.steps[+prevKey.split(':')[1]] : null;
  prevKey=key;
  renderPills();
  const stage=$('stage'); stage.dataset.focus=s.focus; stage.classList.toggle('wide',!!ch.wide);

  $('narr').innerHTML = `<div class="anim"><div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p>${s.body}</p><div class="count">${String(ci+1)} · ${ch.label.toUpperCase()} — STEP ${si+1} OF ${ch.steps.length}</div></div>`;

  // phone
  if(!ch.wide){
    const prevCount = prev && prev._msgs ? prev._msgs.length : 0;
    const msgs = s._msgs.map((m,i)=>msgHTML(m, i>=prevCount && prev && si>+0)).join('');
    const ico=(d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    $('phone').innerHTML = `<div class="p-status"><span>9:41</span><span class="ic"><svg width="16" height="10" viewBox="0 0 16 10" fill="#000"><rect x="0" y="7" width="3" height="3" rx="1"/><rect x="4.3" y="5" width="3" height="5" rx="1"/><rect x="8.6" y="2.5" width="3" height="7.5" rx="1"/><rect x="12.9" y="0" width="3" height="10" rx="1"/></svg><svg width="22" height="11" viewBox="0 0 22 11"><rect x=".5" y=".5" width="18" height="10" rx="3" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="12" height="7" rx="1.6" fill="#000"/><rect x="19.5" y="3.5" width="1.5" height="4" rx=".7" fill="#000" opacity=".4"/></svg></span></div>
      <div class="p-head"><span class="p-round">${ico('<path d="M5 9h14M5 15h14"/>')}</span><span class="p-ava">${MU}<span class="nm">Muse</span></span><span class="p-invite">Invite</span></div>
      <div class="p-msgs">${msgs}</div>
      <div class="p-input">${ico('<path d="M12 5v14M5 12h14"/>').replace('<svg','<svg width="20" height="20"')}<span class="txt ${s.typing?'':'ph'}" id="ptxt">${s.typing?'':'Message'}</span>${ico('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>').replace('<svg','<svg width="19" height="19"')}</div>
      <div class="p-tabs"><span class="on">${ico('<path d="M4 12a8 7 0 1 1 3.4 5.7L4 19l1-3.3A6.8 6.8 0 0 1 4 12z"/>')}</span><span>${ico('<rect x="5" y="4" width="14" height="16" rx="2.5"/><path d="M9 9h6M9 13h6M3 8v10"/>')}</span><span>${ico('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>')}</span><span>${ico('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/>')}</span><span>${ico('<circle cx="7.5" cy="7.5" r="3.2"/><path d="M16.5 4l3.5 6h-7z"/><rect x="4.3" y="13.8" width="6.4" height="6.4" rx="1.4"/><circle cx="16.5" cy="17" r="3.2"/>')}</span></div>
      ${s.sheet?sheetHTML(s.sheet):''}`;
    if(typer){clearInterval(typer);typer=null}
    if(s.typing){const el=$('ptxt');let n=0;const full=s.typing;
      const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce){el.innerHTML=full+'<span class="caret"></span>'}
      else{typer=setInterval(()=>{n+=1;el.innerHTML=full.slice(0,n)+'<span class="caret"></span>';if(n>=full.length){clearInterval(typer);typer=null}},28)}}
  }

  // browser
  const b=s.browser||{};
  const page = b.page ? PAGES[b.page](b) : `<div style="display:grid;place-items:center;height:100%;color:var(--paper-muted);font-size:13px;background:var(--paper-soft)">Muse hasn’t opened a site yet</div>`;
  $('browser').innerHTML = `<div class="b-chrome"><span class="b-dots"><i></i><i></i><i></i></span>${ch.wide?`<span class="b-tag">HUMAN console</span>`:`<span class="b-tag">${MU}Muse is browsing</span>`}<span class="b-url">${b.url||'—'}</span><span class="b-live">${H}Protected by HUMAN</span></div>
    <div class="b-page"><div class="pg${b.page==='console'?' con':''}">${page}${b.door?doorHTML(b.door):''}</div></div>`;
  // panel
  const old=$('bcol').querySelector('.panel'); if(old) old.remove();
  if(s.panel) $('bcol').insertAdjacentHTML('beforeend', panelHTML(s.panel));
  drawArt();

  // progress
  $('prog').innerHTML = ch.steps.map((_,i)=>`<button class="${i<si?'past':i===si?'cur':''}" aria-label="Step ${i+1}" data-s="${i}"></button>`).join('');
  $('prog').querySelectorAll('button').forEach(x=>x.onclick=()=>go(ci,+x.dataset.s));
  $('bPrev').disabled = ci===0 && si===0;
  const last = ci===CH.length-1 && si===ch.steps.length-1;
  $('bNext').disabled = last;
  try{ if(location.hash!=='#'+ch.id) history.replaceState(null,'','#'+ch.id) }catch(e){}
}
function go(c,s){ci=Math.max(0,Math.min(CH.length-1,c));si=Math.max(0,Math.min(CH[ci].steps.length-1,s));render()}
function next(){const ch=CH[ci]; if(si<ch.steps.length-1) go(ci,si+1); else if(ci<CH.length-1) go(ci+1,0)}
function prev(){ if(si>0) go(ci,si-1); else if(ci>0) go(ci-1,CH[ci-1].steps.length-1)}
function full(){try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}) }catch(e){}}

$('bNext').onclick=next; $('bPrev').onclick=prev; $('bRestart').onclick=()=>go(ci,0); $('bFull').onclick=full;
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '){e.preventDefault();next()}
  else if(k==='ArrowLeft'){e.preventDefault();prev()}
  else if(/^[1-4]$/.test(k)) go(+k-1,0);
  else if(k==='r'||k==='R') go(ci,0);
  else if(k==='f'||k==='F') full();
});
function fromHash(){const h=location.hash.replace('#','');const i=CH.findIndex(c=>c.id===h);if(i>=0&&i!==ci) go(i,0)}
window.addEventListener('hashchange',fromHash);

/* small generated product art for the kit (canvas, no external image) */
function drawArt(){
  document.querySelectorAll('canvas[data-art="kit"]').forEach(cv=>{
    const x=cv.getContext('2d'),W=cv.width;x.clearRect(0,0,W,W);
    const cols=['#5728DE','#6C47FF','#F59E0B','#22C55E','#EAE4FB','#1C1C2E'];
    let seed=7;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
    for(let i=0;i<26;i++){const w=30+r()*50,h=20+r()*30,px=20+r()*(W-40-w),py=40+r()*(W-80-h);
      x.fillStyle=cols[i%cols.length];x.beginPath();x.roundRect?x.roundRect(px,py,w,h,5):x.rect(px,py,w,h);x.fill();
      x.fillStyle='rgba(255,255,255,.35)';for(let k=0;k<Math.floor(w/14);k++){x.beginPath();x.arc(px+8+k*14,py+6,3.2,0,7);x.fill()}}
    x.fillStyle='#F59E0B';x.beginPath();const cx=W*0.78,cy=W*0.2;for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?9:22;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.fill();
  });
}

const h0=location.hash.replace('#','');const i0=CH.findIndex(c=>c.id===h0);if(i0>0)ci=i0;
render();
})();
</script>
